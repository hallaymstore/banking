<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clients · Bank Simulator Pro</title>
<style>
:root{--bg:#f7f9fc;--panel:#fff;--text:#152033;--muted:#687386;--line:#e6ebf2;--brand:#2457f5;--brand2:#6d5dfc;--soft:#eef4ff;--shadow:0 18px 48px rgba(18,31,56,.08);font-family:Inter,system-ui,Segoe UI,sans-serif;font-size:13px;color-scheme:light}html[data-theme=dark]{--bg:#090d14;--panel:#101823;--text:#edf3ff;--muted:#96a3b7;--line:#223044;--brand:#7aa2ff;--brand2:#9f8cff;--soft:#142033;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}.hidden{display:none!important}.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{border-right:1px solid var(--line);background:color-mix(in srgb,var(--panel) 94%,transparent);padding:14px;position:sticky;top:0;height:100vh}.brand{display:flex;gap:10px;align-items:center;margin-bottom:16px}.logo{width:38px;height:38px;border-radius:14px;background:var(--brand);display:grid;place-items:center;color:#fff;font-weight:900}.brand h1{font-size:14px;margin:0}.brand p{font-size:11px;margin:2px 0 0;color:var(--muted)}.nav{display:grid;gap:6px}.nav a,.nav button{border:1px solid transparent;background:transparent;color:var(--muted);padding:9px 10px;border-radius:12px;text-align:left;font-weight:800;font-size:12px;cursor:pointer}.nav a:hover,.nav button:hover,.nav .active{background:var(--soft);color:var(--text);border-color:var(--line)}.main{padding:14px}.topbar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px}.title h2{font-size:20px;margin:0 0 3px}.title p{margin:0;color:var(--muted);font-size:12px}.toolbar,.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.chip,.badge{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:6px 8px;border-radius:999px;font-size:10.5px;font-weight:900}.grid{display:grid;gap:10px}.grid-2{grid-template-columns:repeat(2,1fr)}.grid-3{grid-template-columns:repeat(3,1fr)}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:12px}.card h3{font-size:13px;margin:0 0 10px}input,select,button{font:inherit}input,select{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:9px 10px;font-size:12px}label{display:grid;gap:5px;color:var(--muted);font-size:10.5px;font-weight:900}button{border:0;background:var(--brand);color:white;padding:9px 12px;border-radius:12px;font-weight:900;font-size:12px;cursor:pointer}button.secondary{background:var(--soft);color:var(--text);border:1px solid var(--line)}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px}table{width:100%;border-collapse:collapse;min-width:760px;background:var(--panel)}th,td{padding:8px 9px;border-bottom:1px solid var(--line);font-size:11.5px;text-align:left}th{color:var(--muted);text-transform:uppercase;font-size:10px;background:color-mix(in srgb,var(--soft) 60%,transparent)}.toast{position:fixed;right:14px;bottom:14px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:14px;padding:10px 12px;font-weight:800}@media(max-width:760px){.shell{grid-template-columns:1fr}.side{height:auto;position:relative}.grid-2,.grid-3{grid-template-columns:1fr}.topbar{align-items:flex-start;flex-direction:column}.toolbar{width:100%}.toolbar>*{flex:1}}
.scroll-y{max-height:360px;overflow:auto;scrollbar-width:thin}.table-wrap{max-height:390px}.table-wrap thead th{position:sticky;top:0;z-index:1}.card{overflow:hidden}.focus-ring:focus,input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--brand) 34%,transparent);outline-offset:2px}.mini-note{border:1px solid var(--line);background:var(--soft);border-radius:14px;padding:9px;color:var(--muted);font-size:11.5px;line-height:1.45}.kbd{font-size:10px;border:1px solid var(--line);border-bottom-width:2px;border-radius:7px;padding:2px 5px;background:var(--panel);color:var(--muted);font-weight:900}.empty{border:1px dashed var(--line);border-radius:14px;padding:12px;color:var(--muted);text-align:center;background:var(--soft)}</style></head><body><div class="shell"><aside class="side"><div class="brand"><div class="logo">UB</div><div><h1>Bank Simulator Pro</h1><p>Client Registry</p></div></div><nav class="nav" id="nav"></nav></aside><main class="main">
<div class="topbar"><div class="title"><h2 data-i18n="clients">Mijozlar</h2><p>Mijoz profili, hisob raqamlar va izlash</p></div><div class="toolbar"><span class="chip" id="userChip">...</span><select id="lang" onchange="setLang(this.value)"><option value="uz">UZ</option><option value="ru">RU</option><option value="en">EN</option></select><button class="secondary" id="themeBtn" onclick="toggleTheme()">☀️</button><button class="secondary" onclick="loadAll()" data-i18n="refresh">Yangilash</button></div></div>
<section class="grid grid-2">
 <div class="card" data-perm="manage_clients"><h3>Yangi mijoz</h3><form id="clientForm" class="grid grid-3"><label>F.I.Sh<input name="fullName"></label><label>Telefon<input name="phone"></label><label>Pasport<input name="passport"></label><label>PINFL<input name="pinfl"></label><label>Kasb<input name="profession"></label><label>Segment<select name="segment"><option>regular</option><option>student</option><option>teacher</option><option>business</option><option>vip</option></select></label><button data-i18n="create">Yaratish</button></form></div>
 <div class="card" data-perm="manage_clients"><h3>Hisob raqam ochish</h3><form id="accountForm" class="grid grid-3"><label>Mijoz<select name="clientId" id="clientSelect"></select></label><label>Tur<select name="type"><option value="current">Current</option><option value="saving">Saving</option><option value="salary">Salary</option><option value="deposit">Deposit</option></select></label><label>Valyuta<select name="currency"><option>UZS</option><option>USD</option><option>EUR</option><option>RUB</option></select></label><label>Boshlang‘ich<input name="initialBalance" type="number"></label><button>Hisob ochish</button></form></div>
</section>
<section class="card" style="margin-top:10px"><div class="row" style="margin-bottom:10px"><input id="search" placeholder="F.I.Sh / telefon / pasport" oninput="loadClients()"><button class="secondary" onclick="loadClients()">Qidirish</button></div><div class="table-wrap"><table><thead><tr><th>F.I.Sh</th><th>Telefon</th><th>Pasport</th><th>Segment</th><th>Status</th><th>Joylashuv</th></tr></thead><tbody id="clientsBody"></tbody></table></div></section>
<section class="card" style="margin-top:10px"><h3>Hisoblar</h3><div class="table-wrap"><table><thead><tr><th>Mijoz</th><th>Hisob</th><th>Tur</th><th>Valyuta</th><th>Qoldiq</th><th>Status</th></tr></thead><tbody id="accountsBody"></tbody></table></div></section>
</main></div><script>
const I18N={uz:{clients:'Mijozlar',dashboard:'Boshqaruv',staff:'Xodim paneli',reports:'Hisobotlar',logout:'Chiqish',refresh:'Yangilash',create:'Yaratish',dark:'Tungi',light:'Kunduzgi'},ru:{clients:'Клиенты',dashboard:'Панель',staff:'Панель сотрудника',reports:'Отчёты',logout:'Выйти',refresh:'Обновить',create:'Создать',dark:'Ночь',light:'День'},en:{clients:'Clients',dashboard:'Dashboard',staff:'Staff panel',reports:'Reports',logout:'Logout',refresh:'Refresh',create:'Create',dark:'Dark',light:'Light'}};
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],token=()=>localStorage.getItem('bankToken'),lang=()=>localStorage.getItem('bankLang')||'uz';function tr(k){return I18N[lang()]?.[k]||I18N.uz[k]||k}function setTheme(v){document.documentElement.dataset.theme=v;localStorage.setItem('bankTheme',v);const b=$('#themeBtn');if(b)b.textContent=v==='dark'?'🌙 '+tr('dark'):'☀️ '+tr('light')}function toggleTheme(){setTheme((localStorage.getItem('bankTheme')||'light')==='dark'?'light':'dark')}function setLang(v){localStorage.setItem('bankLang',v);applyLang()}function applyLang(){$$('[data-i18n]').forEach(e=>e.textContent=tr(e.dataset.i18n));$('#lang').value=lang();if($('#nav')&&typeof ME!=='undefined'&&ME)$('#nav').innerHTML=nav();setTheme(localStorage.getItem('bankTheme')||'light')}async function api(u,o={}){const r=await fetch(u,{...o,headers:{'Content-Type':'application/json',...(o.headers||{}),Authorization:'Bearer '+token()}});let d={};try{d=await r.json()}catch(e){}if(!r.ok)throw new Error(d.message||'API error');return d}function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3000)}function formData(id){return Object.fromEntries(new FormData($(id)).entries())}function money(n,c='UZS'){return new Intl.NumberFormat(lang()==='ru'?'ru-RU':lang()==='en'?'en-US':'uz-UZ').format(Math.round(Number(n||0)))+' '+c}function can(me,p){return me?.permissions?.includes('*')||me?.permissions?.includes(p)}function canAny(me,s){return s.split(',').some(p=>can(me,p.trim()))}function rbac(me){$$('[data-perm]').forEach(e=>e.classList.toggle('hidden',!canAny(me,e.dataset.perm)));$$('[data-role]').forEach(e=>e.classList.toggle('hidden',!e.dataset.role.split(',').includes(me.role)))}function logout(){localStorage.removeItem('bankToken');location.href='/login.html'}function nav(){const current=location.pathname.split('/').pop()||'staff.html';const items=[{file:'admin.html',href:'/admin.html',label:`🏦 ${tr('dashboard')}`,show:ME&&['admin','director'].includes(ME.role)},{file:'staff.html',href:'/staff.html',label:`🧑‍💼 ${tr('staff')}`,show:true},{file:'game.html',href:'/game.html',label:`🎮 Virtual filial`,show:true},{file:'clients.html',href:'/clients.html',label:`👥 ${tr('clients')}`,show:ME&&canAny(ME,'manage_clients,view_reports,audit_view')},{file:'reports.html',href:'/reports.html',label:`📊 ${tr('reports')}`,show:ME&&canAny(ME,'view_reports,audit_view,payroll')}];return items.filter(i=>i.show).map(i=>`<a class="${current===i.file?'active':''}" href="${i.href}">${i.label}</a>`).join('')+`<button onclick="logout()">↩ ${tr('logout')}</button>`}function safe(v){return String(v??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}function opt(v,t){return `<option value="${v}">${safe(t)}</option>`}
async function init(){if(!token())return location.href='/login.html';CONFIG=await api('/api/auth/me');ME=CONFIG.user;if(!canAny(ME,'manage_clients,view_reports,audit_view'))return location.href='/staff.html';$('#nav').innerHTML=nav();$('#userChip').textContent=`${ME.fullName} · ${ME.roleLabel}`;rbac(ME);applyLang();await loadAll()}async function loadAll(){await loadClients();await loadAccounts()}async function loadClients(){try{CLIENTS=await api('/api/clients?q='+encodeURIComponent($('#search')?.value||''));$('#clientSelect').innerHTML='<option value="">—</option>'+CLIENTS.map(c=>opt(c._id,c.fullName)).join('');$('#clientsBody').innerHTML=CLIENTS.map(c=>`<tr><td>${safe(c.fullName)}</td><td>${safe(c.phone)}</td><td>${safe(c.passport)}</td><td><span class="badge">${c.segment}</span></td><td>${c.status}</td><td>${safe(c.currentLocation)}</td></tr>`).join('')}catch(e){toast(e.message)}}async function loadAccounts(){try{ACCOUNTS=await api('/api/accounts');$('#accountsBody').innerHTML=ACCOUNTS.map(a=>`<tr><td>${safe(a.client?.fullName)}</td><td>${a.accountNumber}</td><td>${a.type}</td><td>${a.currency}</td><td>${money(a.balance,a.currency)}</td><td>${a.status}</td></tr>`).join('')}catch(e){toast(e.message)}}function bind(f,u){$(f).onsubmit=async e=>{e.preventDefault();try{await api(u,{method:'POST',body:JSON.stringify(formData(f))});toast('Saqlandi');e.target.reset();loadAll()}catch(err){toast(err.message)}}}bind('#clientForm','/api/clients');bind('#accountForm','/api/accounts');let CONFIG,ME,CLIENTS=[],ACCOUNTS=[];setTheme(localStorage.getItem('bankTheme')||'light');init();
</script></body></html>
